{% extends "admin/login.html" %}
{% load i18n %}

{% block extrahead %}
    {{ block.super }}
    <script>
        (() => {
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.slice(1));
            if (params.has("sso")) {
                window.location.replace("{% url 'sso_entry' %}" + hash);
            }
        })();
    </script>
{% endblock %}
